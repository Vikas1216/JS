<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      max-width: 460px;
      width: 100%;
      padding: 32px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .length-group {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .length-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .length-badge {
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.95rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .option-item:hover {
      border-color: #38bdf8;
      background-color: #162033;
    }

    .option-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .generate-btn:hover {
      opacity: 0.92;
    }

    .generate-btn:active {
      transform: scale(0.99);
    }

    .result-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #334155;
    }

    .result-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 10px;
      display: block;
    }

    .result-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      min-height: 50px;
    }

    #result {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 1rem;
      color: #e2e8f0;
      word-break: break-all;
    }

    #copyBtn {
      background-color: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    #copyBtn:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Password Generator</h1>
    <p class="subtitle">
      Generates secure random passwords with adjustable length and character sets. Built with arrays, string manipulation and Clipboard API.
    </p>

    <div class="length-group">
      <div class="length-header">
        <label for="length">Password length</label>
        <span id="lengthValue" class="length-badge">16</span>
      </div>
      <input type="range" id="length" value="16" min="4" max="50" />
    </div>

    <div class="options-list">
      <label class="option-item">
        <input type="checkbox" id="lowercase" checked />
        <span>Lower case (a-z)</span>
      </label>

      <label class="option-item">
        <input type="checkbox" id="uppercase" checked />
        <span>Upper case (A-Z)</span>
      </label>

      <label class="option-item">
        <input type="checkbox" id="numbers" checked />
        <span>Number (0-9)</span>
      </label>

      <label class="option-item">
        <input type="checkbox" id="symbols" checked />
        <span>Special Symbol (!@#$...)</span>
      </label>
    </div>

    <button id="generateBtn" class="generate-btn">Generate Password</button>

    <div class="result-section">
      <span class="result-label">Generated Password :</span>
      <div class="result-box">
        <span id="result">Click generate to create a password</span>
        <button id="copyBtn" style="display: none;">Copy</button>
      </div>
    </div>
  </div>

  <script>
    function generatePassword(length = 16, options = {}) {
      const {
        uppercase = true,
        lowercase = true,
        numbers = true,
        symbols = true,
      } = options;

      const charSets = {
        uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
        lowercase: "abcdefghijklmnopqrstuvwxyz",
        numbers: "0123456789",
        symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?",
      };

      let pool = "";
      if (uppercase) pool += charSets.uppercase;
      if (lowercase) pool += charSets.lowercase;
      if (numbers) pool += charSets.numbers;
      if (symbols) pool += charSets.symbols;

      if (!pool) return "";

      let password = "";
      for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * pool.length);
        password += pool[randomIndex];
      }

      return password;
    }

    const lengthSlider = document.getElementById("length");
    const lengthValue = document.getElementById("lengthValue");
    const resultSpan = document.getElementById("result");
    const copyBtn = document.getElementById("copyBtn");

    lengthSlider.addEventListener("input", () => {
      lengthValue.textContent = lengthSlider.value;
    });

    document.getElementById("generateBtn").addEventListener("click", () => {
      const length = Number(lengthSlider.value);

      const options = {
        lowercase: document.getElementById("lowercase").checked,
        uppercase: document.getElementById("uppercase").checked,
        numbers: document.getElementById("numbers").checked,
        symbols: document.getElementById("symbols").checked,
      };

      const password = generatePassword(length, options);

      if (!password) {
        resultSpan.textContent = "Select at least one character type.";
        copyBtn.style.display = "none";
        return;
      }

      resultSpan.textContent = password;
      copyBtn.style.display = "inline-block";
    });

    copyBtn.addEventListener("click", async () => {
      const password = resultSpan.textContent;
      if (!password) return;

      await navigator.clipboard.writeText(password);
      copyBtn.textContent = "Copied!";

      setTimeout(() => {
        copyBtn.textContent = "Copy";
      }, 1500);
    });
  </script>
</body>
</html>
