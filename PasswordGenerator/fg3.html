<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <div>
        <label for="username" class="form-label">User Name</label>
        <input type="text"  id="username" >
        <button id="btnCopied" class="btn btn-primary">Copy username</button>
    </div>
    <script>
        document.getElementById('btnCopied').addEventListener("click" ,async() =>{
                
            //     const resultSpan = document.getElementById("username");
            // const username = resultSpan.value;
            const username = document.getElementById('username').value;
            if(!username) console.log('error');

            console.log(username);

            await navigator.clipboard.writeText(username);

        });
    </script>
</body>
</html>
