<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Strength Meter & Live Checklist</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
    .form-group { margin-bottom: 15px; }

    /* Input & Eye Toggle Styling */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      margin-top: 5px;
    }
    .password-wrapper input {
      width: 100%;
      padding: 8px 38px 8px 8px;
      box-sizing: border-box;
    }
    .toggle-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      color: #555;
    }
    .toggle-btn:hover { color: #000; }

    /* Strength Meter Bar Styling */
    .strength-container {
      margin-top: 8px;
    }
    .strength-track {
      width: 100%;
      height: 6px;
      background-color: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      background-color: #d9534f;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    .strength-label {
      font-size: 12px;
      font-weight: bold;
      margin-top: 4px;
      display: block;
      color: #666;
    }

    /* Checklist & Error Messages */
    ul { list-style: none; padding-left: 0; font-size: 14px; margin-top: 10px; }
    li { color: #d9534f; margin: 5px 0; }
    li.valid { color: #28a745; font-weight: bold; }
    .error-msg { color: #d9534f; font-size: 13px; display: block; margin-top: 5px; }
  </style>
</head>
<body>

  <form id="signup-form" novalidate>
    <!-- Password Field -->
    <div class="form-group">
      <label for="password">Password:</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password">
        <button type="button" class="toggle-btn" data-target="password" aria-label="Show password">
          <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>

      <!-- Password Strength Meter Bar -->
      <div class="strength-container">
        <div class="strength-track">
          <div id="strength-fill" class="strength-fill"></div>
        </div>
        <span id="strength-label" class="strength-label">Strength: None</span>
      </div>
    </div>

    <!-- Live Password Checklist -->
    <ul id="checklist">
      <li id="rule-length">✖ At least 8 characters</li>
      <li id="rule-upper">✖ At least 1 uppercase letter (A-Z)</li>
      <li id="rule-lower">✖ At least 1 lowercase letter (a-z)</li>
      <li id="rule-symbol">✖ At least 1 special symbol (!@#$...)</li>
    </ul>

    <!-- Confirm Password Field -->
    <div class="form-group">
      <label for="confirm-password">Confirm Password:</label>
      <div class="password-wrapper">
        <input type="password" id="confirm-password" name="confirm_password">
        <button type="button" class="toggle-btn" data-target="confirm-password" aria-label="Show confirm password">
          <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
      <small id="match-msg" class="error-msg"></small>
    </div>

    <button type="submit">Register</button>
  </form>

  <script>
    const form = document.getElementById('signup-form');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm-password');
    const matchMsg = document.getElementById('match-msg');
    const strengthFill = document.getElementById('strength-fill');
    const strengthLabel = document.getElementById('strength-label');

    // --- 1. Show/Hide Password Toggle ---
    document.querySelectorAll('.toggle-btn').forEach(button => {
      button.addEventListener('click', function () {
        const input = document.getElementById(this.getAttribute('data-target'));
        const eyeOpen = this.querySelector('.eye-open');
        const eyeClosed = this.querySelector('.eye-closed');

        if (input.type === 'password') {
          input.type = 'text';
          eyeOpen.style.display = 'none';
          eyeClosed.style.display = 'block';
          this.setAttribute('aria-label', 'Hide password');
        } else {
          input.type = 'password';
          eyeOpen.style.display = 'block';
          eyeClosed.style.display = 'none';
          this.setAttribute('aria-label', 'Show password');
        }
      });
    });

    // --- 2. Strength Bar & Checklist Logic ---
    const rules = {
      length: document.getElementById('rule-length'),
      upper: document.getElementById('rule-upper'),
      lower: document.getElementById('rule-lower'),
      symbol: document.getElementById('rule-symbol')
    };

    function updateRule(element, isValid, text) {
      if (isValid) {
        element.classList.add('valid');
        element.textContent = '✔ ' + text;
      } else {
        element.classList.remove('valid');
        element.textContent = '✖ ' + text;
      }
    }

    function updateStrengthMeter(score, isEmpty) {
      if (isEmpty) {
        strengthFill.style.width = '0%';
        strengthLabel.textContent = 'Strength: None';
        strengthLabel.style.color = '#666';
        return;
      }

      const levels = [
        { width: '25%', color: '#d9534f', text: 'Weak' },     // 1 rule met
        { width: '50%', color: '#f0ad4e', text: 'Fair' },     // 2 rules met
        { width: '75%', color: '#5bc0de', text: 'Good' },     // 3 rules met
        { width: '100%', color: '#28a745', text: 'Strong' }   // All 4 rules met
      ];

      // Ensure at least level 0 (Weak) displays if the user typed something
      const current = levels[Math.max(0, score - 1)];
      strengthFill.style.width = current.width;
      strengthFill.style.backgroundColor = current.color;
      strengthLabel.textContent = 'Strength: ' + current.text;
      strengthLabel.style.color = current.color;
    }

    function validatePasswordLive() {
      const val = passwordInput.value;
      const hasLength = val.length >= 8;
      const hasUpper = /[A-Z]/.test(val);
      const hasLower = /[a-z]/.test(val);
      const hasSymbol = /[^A-Za-z0-9]/.test(val);

      updateRule(rules.length, hasLength, 'At least 8 characters');
      updateRule(rules.upper, hasUpper, 'At least 1 uppercase letter (A-Z)');
      updateRule(rules.lower, hasLower, 'At least 1 lowercase letter (a-z)');
      updateRule(rules.symbol, hasSymbol, 'At least 1 special symbol (!@#$...)');

      // Calculate score from 0 to 4
      const score = [hasLength, hasUpper, hasLower, hasSymbol].filter(Boolean).length;
      updateStrengthMeter(score, val.length === 0);

      if (confirmInput.value.length > 0) {
        checkPasswordsMatch();
      }
      return score === 4;
    }

    function checkPasswordsMatch() {
      if (confirmInput.value === '') {
        matchMsg.textContent = '';
        return false;
      }
      if (passwordInput.value === confirmInput.value) {
        matchMsg.style.color = '#28a745';
        matchMsg.textContent = '✔ Passwords match';
        return true;
      } else {
        matchMsg.style.color = '#d9534f';
        matchMsg.textContent = '✖ Passwords do not match';
        return false;
      }
    }

    passwordInput.addEventListener('input', validatePasswordLive);
    confirmInput.addEventListener('input', checkPasswordsMatch);

    // --- 3. Form Submit Check ---
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const isStrong = validatePasswordLive();
      const isMatching = checkPasswordsMatch();

      if (!isStrong) {
        alert('Please meet all password requirements.');
        return;
      }
      if (!isMatching) {
        matchMsg.style.color = '#d9534f';
        matchMsg.textContent = '✖ Passwords must match before submitting.';
        return;
      }

      alert('Success! Form is valid and ready to submit.');
      form.submit();
    });
  </script>

</body>
</html>
