<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 40px auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        #matchMsg{
            color:grey;
            font-weight: bold;
        }
    </style>
</head>

<body>
   
    
        <div class="form-group">
            <label for="username" class="form-label">User Name</label>
            <input type="text" class="form-control" id="passwordInput" name="passwordInput">
            
        </div>
        <div class="form-group">
            <label for="username" class="form-label">Confirm Username</label>
            <input type="text" class="form-control" id="confirmInput" name="confirmInput">
            <div id="matchMsg" class="form-text">Check User name is match or not ?</div>
        </div>

        <button type="submit" class="btn btn-primary" onclick="checkUserLive()">Submit</button>
 
    <script>
        let passwordInput = document.getElementById('passwordInput');
        let confirmInput = document.getElementById('confirmInput');
        let matchMsg = document.getElementById('matchMsg') ;

        function checkUserLive() {
            if(confirmInput.value ==" "){
            matchMsg.textContent = "Please enter confirm username";
            }

            if(passwordInput.value==confirmInput.value) {
                matchMsg.textContent = '✔ Passwords match';
                matchMsg.style.color='green';
            }
            else {
               matchMsg.textContent =' ✖ Passwords do not match';
               matchMsg.style.color='red';
            }
        }
        confirmInput.addEventListener('input',checkUserLive);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</body>

</html>
